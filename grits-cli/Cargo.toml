[package]
name = "grits-cli"
version = "2.4.1"
edition = "2021"
description = "Git-native, local-first issue tracker CLI and MCP server."
license = "MIT"
repository = "https://github.com/babybirdprd/grits"
homepage = "https://github.com/babybirdprd/grits"
readme = "../README.md"

[[bin]]
name = "gr"
path = "src/main.rs"

[dependencies]
grits-core = { version = "2.4.1", path = "../grits-core" }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.23.0"
edit = "0.1.5"
comfy-table = "7.2.1"
colored = "3.0.0"

# MCP Server (Agent Engine)
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
schemars = "1.0"

# Strategic MCP Tools (file/git operations)
walkdir = "2.5"
regex = "1.11"
git2 = { version = "0.19", features = ["vendored-libgit2"] }
# Use vendored openssl for macOS/Linux cross-builds in CI, but skip on Windows to avoid Perl requirement
[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
